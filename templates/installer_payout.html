{% extends 'base.html' %}
{% load humanize %}
{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/jalalidatepicker/dist/jalalidatepicker.min.css">
{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card bg-dark border-secondary mx-auto" style="max-width: 500px;">
        <div class="card-header border-secondary bg-dark bg-opacity-50 p-4">
            <h5 class="mb-0 text-white"><i class="fa-solid fa-handshake text-warning me-2"></i> ثبت تسویه حساب</h5>
        </div>
        <div class="card-body p-4">
            <div class="alert alert-info border-0 rounded-3 d-flex justify-content-between align-items-center">
                <span>موجودی نصاب ({{ installer.get_full_name }}):</span>
                <strong class="fs-4" id="maxBalance" data-val="{{ balance }}">{{ balance|intcomma }} تومان</strong>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-secondary small">مبلغ تسویه (تومان):</label>
                    <div class="input-group">
                        <input type="number" name="amount" id="amountInput" class="form-control bg-dark text-white border-secondary" required min="1000" max="{{ balance }}">
                        <button type="button" class="btn btn-outline-info" onclick="fillMax()">کل موجودی</button>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label class="form-label text-secondary small">تاریخ تسویه:</label>
                    <input type="text" name="date" data-jdp class="form-control bg-dark text-white border-secondary" value="{{ today }}" required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary small">توضیحات (اختیاری):</label>
                    <textarea name="description" class="form-control bg-dark text-white border-secondary" rows="2" placeholder="مثال: واریز به کارت بانک ملت"></textarea>
                </div>

                <button type="submit" class="btn btn-warning w-100 fw-bold rounded-pill text-dark">ثبت قطعی تسویه</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="https://unpkg.com/jalalidatepicker/dist/jalalidatepicker.min.js"></script>
<script>
    jalaliDatepicker.startWatch({ separatorChar: "/" });
    function fillMax() {
        document.getElementById('amountInput').value = document.getElementById('maxBalance').getAttribute('data-val');
    }
</script>
{% endblock %}
