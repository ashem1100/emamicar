{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}سامانه مدیریت انبار باتری{% endblock %}</title>

    <!-- Bootstrap RTL Local -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.rtl.css' %}">

    <!-- FontAwesome Icons (Local) -->
    <link rel="stylesheet" href="{% static 'css/all.min.css' %}">

    <!-- Vazirmatn Persian Font (Local) -->
    <link href="{% static 'css/font.css' %}" rel="stylesheet">

    <!-- Jalali Datepicker (Local) -->
    <link rel="stylesheet" href="{% static 'css/jalalidatepicker.min.css' %}">

    <style>
        body {
            font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }

        .navbar-custom {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .stat-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        /* Gradients */
        .bg-gradient-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .bg-gradient-amber { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .bg-gradient-emerald { background: linear-gradient(135deg, #10b981, #047857); }
        .bg-gradient-purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .bg-gradient-sky { background: linear-gradient(135deg, #0284c7, #0369a1); }

        .content-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
        }

        /* استایل جدول تیره */
        .table-dark-custom {
            --bs-table-bg: transparent;
            --bs-table-color: #f1f5f9;
            margin-bottom: 0;
        }

        .table-dark-custom th {
            background-color: #0f172a !important;
            color: #94a3b8 !important;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
            padding: 14px 16px;
        }

        .table-dark-custom td {
            background-color: #1e293b !important;
            color: #f8fafc !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05) !important;
            padding: 14px 16px;
            vertical-align: middle;
        }

        .table-dark-custom tr:hover td {
            background-color: #334155 !important;
        }

        .badge-amber {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        /* اسکرول‌بار افقی تمیز برای بخش فیلترها */
        .filter-scroll-wrapper {
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            padding-bottom: 4px;
        }

        .filter-scroll-wrapper::-webkit-scrollbar {
            display: none;
        }

        .filter-btn-group .btn {
            font-size: 0.825rem;
            padding-top: 6px;
            padding-bottom: 6px;
        }

        .chart-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            height: 100%;
        }

        /* اصلاح نمایش فیلدهای تقویم شمسی */
        jdp-container {
            font-family: 'Vazirmatn', sans-serif !important;
            border-radius: 12px !important;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important;
            z-index: 99999 !important;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- ناوبار مشترک برای تمام صفحات -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top py-2 py-md-3">
        <div class="container-fluid px-3 px-md-4">
            <a class="navbar-brand text-white fw-bold d-flex align-items-center gap-2" href="{% url 'battery_dashboard' %}">
                <i class="fa-solid fa-car-battery text-warning fs-4 me-1"></i>
                <span class="fs-6 fs-md-5">مدیریت انبار باتری</span>
            </a>

            <!-- منوی هدر -->
            <div class="d-flex align-items-center gap-1 gap-md-2 overflow-x-auto">
                <a href="{% url 'battery_dashboard' %}" class="btn btn-outline-light btn-sm rounded-pill px-2 px-md-3 text-nowrap">
                    <i class="fa-solid fa-gauge me-1"></i> داشبورد
                </a>

                <a href="{% url 'battery_analytics' %}" class="btn btn-outline-info btn-sm rounded-pill px-2 px-md-3 text-nowrap">
                    <i class="fa-solid fa-chart-pie me-1"></i> نمودارها
                </a>

                <a href="{% url 'sale_list' %}" class="btn btn-outline-success btn-sm rounded-pill px-2 px-md-3 text-nowrap">
                    <i class="fa-solid fa-list-check me-1"></i> فروش‌ها
                </a>

                <a href="{% url 'installer_management' %}" class="btn btn-outline-warning btn-sm rounded-pill px-2 px-md-3 text-nowrap">
                    <i class="fa-solid fa-users-gear me-1"></i> کارکنان
                </a>
            </div>
        </div>
    </nav>

    <!-- محتوای اصلی هر صفحه -->
    {% block content %}
    {% endblock %}

    <!-- Bootstrap Local JS -->
    <script src="{% static 'js/bootstrap.bundle.js' %}"></script>

    <!-- Jalali Datepicker Local JS -->
    <script src="{% static 'js/jalalidatepicker.min.js' %}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            jalaliDatepicker.startWatch({
                separatorChar: "/",
                minDate: "attr",
                maxDate: "attr",
                changeMonthRotateYear: true
            });
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
