{% extends 'installer_base.html' %}

{% block extra_css %}
<style>
    .login-card {
        background: #1e293b;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        overflow: hidden;
    }
    .login-header {
        background: rgba(15, 23, 42, 0.5);
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .form-dark {
        background-color: #0f172a;
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #f8fafc;
        border-radius: 12px;
        padding: 12px 16px;
    }
    .form-dark:focus {
        background-color: #0f172a;
        color: #fff;
        border-color: #38bdf8;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1);
    }
    .btn-login {
        background: linear-gradient(135deg, #0ea5e9, #0284c7);
        color: #fff;
        border-radius: 12px;
        padding: 12px;
        font-weight: bold;
        transition: all 0.3s ease;
    }
    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(2, 132, 199, 0.4);
        color: #fff;
    }
</style>
{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="login-card w-100" style="max-width: 420px;">
        <div class="login-header text-center p-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary rounded-circle mb-3 shadow" style="width: 64px; height: 64px;">
                <i class="fa-solid fa-bolt text-white fs-2"></i>
            </div>
            <h4 class="fw-bold text-white mb-1">ورود به پنل کاربری</h4>
            <p class="text-secondary small mb-0">لطفاً نام کاربری و رمز عبور خود را وارد کنید</p>
        </div>
        
        <div class="p-4 p-md-5">
            <form method="POST">
                {% csrf_token %}
                
                {% if form.errors %}
                <div class="alert alert-danger small py-2 mb-4 rounded-3 text-center border-0">
                    نام کاربری یا رمز عبور اشتباه است.
                </div>
                {% endif %}

                <div class="mb-4">
                    <label class="form-label text-secondary small fw-bold mb-2">نام کاربری:</label>
                    <div class="position-relative">
                        <i class="fa-solid fa-user position-absolute top-50 translate-middle-y text-secondary ms-3" style="right: 12px;"></i>
                        <input type="text" name="username" class="form-control form-dark pe-5" required placeholder="نام کاربری خود را وارد کنید">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary small fw-bold mb-2">رمز عبور:</label>
                    <div class="position-relative">
                        <i class="fa-solid fa-lock position-absolute top-50 translate-middle-y text-secondary ms-3" style="right: 12px;"></i>
                        <input type="password" name="password" class="form-control form-dark pe-5" required placeholder="رمز عبور خود را وارد کنید">
                    </div>
                </div>

                <button type="submit" class="btn btn-login w-100 border-0 mt-2">
                    <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> ورود به سیستم
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
